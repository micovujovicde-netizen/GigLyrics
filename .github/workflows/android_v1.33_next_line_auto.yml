name: Build GigLyrics APK v1.33 NEXT LINE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find and unpack GigLyrics project
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -iname 'GigLyrics*.zip' | sort | tail -n 1)"

          if [ -z "$ZIP" ]; then
            echo "No GigLyrics*.zip found in repository root."
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q "$ZIP" -d buildsrc

          PROJECT_DIR="$(find buildsrc -type f -name 'settings.gradle.kts' -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle.kts not found after unzip."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GigLyrics-APK-v1.33-NEXT-LINE
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
