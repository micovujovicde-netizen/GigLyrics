name: Build GigMonster_TV APK + signed AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "GigMonster_TV.zip"
      - ".github/workflows/gigmonster_tv.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GIGMONSTER_KEYSTORE_BASE64: ${{ secrets.GIGMONSTER_KEYSTORE_BASE64 }}
      GIGMONSTER_KEYSTORE_PASSWORD: ${{ secrets.GIGMONSTER_KEYSTORE_PASSWORD }}
      GIGMONSTER_KEY_ALIAS: ${{ secrets.GIGMONSTER_KEY_ALIAS }}
      GIGMONSTER_KEY_PASSWORD: ${{ secrets.GIGMONSTER_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack GigMonster_TV
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q GigMonster_TV.zip -d buildsrc

          PROJECT_DIR="$(find buildsrc -type f -name 'settings.gradle.kts' -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle.kts not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GIGMONSTER_KEYSTORE_BASE64" || { echo "Missing GIGMONSTER_KEYSTORE_BASE64"; exit 1; }
          test -n "$GIGMONSTER_KEYSTORE_PASSWORD" || { echo "Missing GIGMONSTER_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$GIGMONSTER_KEY_ALIAS" || { echo "Missing GIGMONSTER_KEY_ALIAS"; exit 1; }
          test -n "$GIGMONSTER_KEY_PASSWORD" || { echo "Missing GIGMONSTER_KEY_PASSWORD"; exit 1; }

      - name: Restore and verify GigMonster signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/GigMonster-upload.jks"
          printf '%s' "$GIGMONSTER_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$GIGMONSTER_KEYSTORE_PASSWORD" \
            -alias "$GIGMONSTER_KEY_ALIAS" >/dev/null

          echo "GIGMONSTER_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug bundleRelease

      - name: Force-sign and verify AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "AAB not found: $AAB"
            exit 1
          fi

          if unzip -l "$AAB" | grep -Eq 'META-INF/[^/]+\.(RSA|DSA|EC)$'; then
            echo "AAB already contains a signing certificate."
          else
            echo "AAB is unsigned. Signing it now..."
            jarsigner \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore "$GIGMONSTER_KEYSTORE_PATH" \
              -storepass "$GIGMONSTER_KEYSTORE_PASSWORD" \
              -keypass "$GIGMONSTER_KEY_PASSWORD" \
              "$AAB" \
              "$GIGMONSTER_KEY_ALIAS"
          fi

          VERIFY_OUTPUT="$(jarsigner -verify -verbose -certs "$AAB" 2>&1)"
          echo "$VERIFY_OUTPUT"
          echo "$VERIFY_OUTPUT" | grep -q "jar verified."
          echo "SIGNED AAB VERIFIED OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GigMonster_TV-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: GigMonster_TV-AAB
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
