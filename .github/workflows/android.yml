name: Build PauseMix APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack PauseMix project
        run: |
          rm -rf PauseMix_V1
          unzip -q PauseMix_V1_fixed.zip -d .
          echo "===== ROOT ====="
          ls -la
          echo "===== PROJECT ====="
          find . -maxdepth 2 -type f | sort | head -n 100

      - name: Find Android project
        id: project
        run: |
          PROJECT_DIR=$(find . -maxdepth 3 \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found after unzip"
            find . -maxdepth 4 -type f | sort | head -n 200
            exit 1
          fi

          echo "Found Android project at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        id: build_apk
        working-directory: ${{ steps.project.outputs.dir }}
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          exit ${PIPESTATUS[0]}

      - name: Show short build errors
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "===== FIRST BUILD ERRORS ====="

          grep -n -E "(^e: | error: |Unresolved reference|Type mismatch|No value passed|Too many arguments|Cannot access|Compilation error|FAILURE:|What went wrong)" \
          build.log | head -n 50 || true

          echo "===== END OF BUILD LOG ====="
          tail -n 120 build.log

      - name: Fail job if build failed
        if: steps.build_apk.outcome == 'failure'
        run: exit 1

      - name: Find APK
        if: steps.build_apk.outcome == 'success'
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PauseMix-debug-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
