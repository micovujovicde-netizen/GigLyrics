name: Build GigLyrics APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack GigLyrics
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q GigLyrics_Android_Project_v2.zip -d buildsrc

      - name: Fix Java/Kotlin target
        run: |
          cat >> buildsrc/GigLyrics/app/build.gradle.kts <<'EOF'

          kotlin {
              jvmToolchain(17)
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("buildsrc/GigLyrics/app/build.gradle.kts")
          s = p.read_text()
          marker = "    buildFeatures {\n        compose = true\n    }\n"
          patch = marker + '''

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          '''
          if "compileOptions {" not in s:
              s = s.replace(marker, patch)
          p.write_text(s)
          PY

      - name: Build APK
        working-directory: buildsrc/GigLyrics
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GigLyrics-APK
          path: buildsrc/GigLyrics/app/build/outputs/apk/debug/app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: GigLyrics-APK
          path: buildsrc/GigLyrics/app/build/outputs/apk/debug/app-debug.apk
