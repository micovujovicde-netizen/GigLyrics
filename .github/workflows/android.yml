name: Build PauseMix APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack PauseMix project
        run: |
          rm -rf PauseMix_V1
          unzip -q PauseMix_V1.zip -d .
          ls -la
          ls -la PauseMix_V1

      - name: Build debug APK
        working-directory: PauseMix_V1
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PauseMix-debug-apk
          path: PauseMix_V1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
