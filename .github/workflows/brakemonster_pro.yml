name: BrakeMonster PRO - Signed Update APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'BrakeMonster_Pro.zip'
      - '.github/workflows/brakemonster_pro.yml'

permissions:
  contents: read

concurrency:
  group: brakemonster-pro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract BrakeMonster PRO source
        shell: bash
        run: |
          set -euo pipefail
          test -s BrakeMonster_Pro.zip
          mkdir -p buildsrc
          unzip -q BrakeMonster_Pro.zip -d buildsrc
          PROJECT_DIR="$(find buildsrc -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Verify PRO application identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.teraphonia.breakmonster.pro"' "$PROJECT_DIR/app/build.gradle.kts"

      - name: Require existing signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.BM_PRO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BM_PRO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BM_PRO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BM_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing signing secret $key. Configure the original keystore in GitHub Actions Secrets; a different key cannot update the installed app."
              exit 1
            fi
          done

      - name: Build PRO release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign and verify release APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.BM_PRO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BM_PRO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BM_PRO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BM_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bm-signing" apk-out
          trap 'rm -f "$RUNNER_TEMP/bm-signing/release.jks"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bm-signing/release.jks"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/zipalign" -f -p 4 \
            "$PROJECT_DIR/app/build/outputs/apk/release/app-release-unsigned.apk" \
            apk-out/BrakeMonster-PRO-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/bm-signing/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out apk-out/BrakeMonster-PRO-UPDATE.apk \
            apk-out/BrakeMonster-PRO-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs apk-out/BrakeMonster-PRO-UPDATE.apk
          rm apk-out/BrakeMonster-PRO-aligned.apk

      - name: Upload signed PRO update APK
        uses: actions/upload-artifact@v4
        with:
          name: BrakeMonster-PRO-UPDATE-APK
          path: apk-out/BrakeMonster-PRO-UPDATE.apk
          if-no-files-found: error
          retention-days: 30
