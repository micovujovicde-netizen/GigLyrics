name: Build BrakeMonster PRO APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'BrakeMonster_Pro.zip'
      - '.github/workflows/brakemonster_pro.yml'

permissions:
  contents: read

concurrency:
  group: brakemonster-pro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pro:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract BrakeMonster PRO source
        shell: bash
        run: |
          set -euo pipefail
          test -s BrakeMonster_Pro.zip
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q BrakeMonster_Pro.zip -d buildsrc
          PROJECT_DIR="$(find buildsrc -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Verify PRO application identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.teraphonia.breakmonster.pro"' "$PROJECT_DIR/app/build.gradle.kts"

      - name: Build PRO debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload BrakeMonster PRO APK
        uses: actions/upload-artifact@v4
        with:
          name: BrakeMonster-PRO-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
